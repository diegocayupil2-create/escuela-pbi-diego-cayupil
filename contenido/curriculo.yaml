    requiere: [c05]
    estado: ga
    competencias:
      - {id: c09-k1, es: "Distingue row context de filter context en cualquier fórmula", en: "Tells row context from filter context in any formula"}
      - {id: c09-k2, es: "Explica por qué el row context no filtra otras tablas", en: "Explains why row context does not filter other tables"}
    fuentes:
      - {titulo: "Row context and filter context in DAX", url: "https://www.sqlbi.com/articles/row-context-and-filter-context-in-dax/", nivel: A, consultado: "2026-11-14"}
