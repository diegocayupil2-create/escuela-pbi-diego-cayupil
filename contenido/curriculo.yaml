      - {id: c10-k3, es: "Elige qué tabla iterar para que la transición sea correcta y barata", en: "Chooses which table to iterate so the transition is correct and cheap"}
    fuentes:
      - {titulo: "Understanding context transition in DAX", url: "https://www.sqlbi.com/articles/understanding-context-transition-in-dax/", nivel: A, consultado: "2026-11-14"}
