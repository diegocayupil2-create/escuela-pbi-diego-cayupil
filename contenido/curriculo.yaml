  - id: c10
    nivel: 2
    area: dax
    titulo: {es: "Transición de contexto", en: "Context transition"}
    resumen:
      es: "Cuándo CALCULATE convierte la fila actual en filtros, por qué toda medida lo hace sola y cómo evitar que un total se infle."
