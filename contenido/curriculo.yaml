# Currículo v1 · Escuela PBI Diego Cayupil
# Cada capítulo trae nivel, área, requisitos, competencias y fuentes con fecha de consulta.
# estado: ga = disponible en general · preview = vista previa · mixto · no-aplica.
# Las páginas se revisan con: npm run verificar-fuentes
version: 1
actualizado: "2026-11-14"
dominio:            # cuándo un capítulo queda dominado (ajustable)
  practicas_min: 3  # prácticas con el puntaje mínimo; una puede ser el cierre
  puntaje_min: 80
  repasos_min: 2    # repasos espaciados exitosos
niveles:
  - {id: 0, nombre: {es: "Nivelación", en: "Placement"}}
  - {id: 1, nombre: {es: "Fundamentos", en: "Foundations"}}
  - {id: 2, nombre: {es: "Intermedio", en: "Intermediate"}}
  - {id: 3, nombre: {es: "Avanzado", en: "Advanced"}}
  - {id: 4, nombre: {es: "Vanguardia", en: "Cutting edge"}}

capitulos:
  - id: c00
    nivel: 0
    area: nivelacion
    titulo: {es: "Nivelación", en: "Placement test"}
    resumen:
      es: "24 preguntas que se adaptan a tus respuestas y un ejercicio corto con dataset. Te ubica por área y arma tu ruta."
      en: "24 adaptive questions and a short hands-on exercise. It places you by area and builds your path."
    requiere: []
    estado: no-aplica
    competencias: []
    fuentes: []

  # ---------- Nivel 1 · Fundamentos ----------
  - id: c01
    nivel: 1
    area: modelado
    titulo: {es: "Modelo estrella: fact tables, dimensions y grain", en: "Star schema: fact tables, dimensions and grain"}
    resumen:
      es: "Por qué Power BI rinde mejor con un star schema y cómo partir una tabla plana en hechos y dimensiones."
      en: "Why Power BI works best with a star schema and how to split a flat table into facts and dimensions."
    requiere: []
    estado: ga
    competencias:
      - {id: c01-k1, es: "Separa una tabla plana en fact table y dimensions", en: "Splits a flat table into a fact table and dimensions"}
      - {id: c01-k2, es: "Declara el grain de cada fact table antes de modelar", en: "States the grain of each fact table before modeling"}
    fuentes:
      - {titulo: "Understand star schema and the importance for Power BI", url: "https://learn.microsoft.com/en-us/power-bi/guidance/star-schema", nivel: A, consultado: "2026-11-14"}

  - id: c02
    nivel: 1
    area: modelado
    titulo: {es: "Relaciones y dirección del filtro", en: "Relationships and filter direction"}
    resumen:
      es: "Relaciones 1:* con filtro en una dirección, y cuándo una relación bidireccional o muchos a muchos se justifica."
      en: "One-to-many relationships with single-direction filters, and when a bidirectional or many-to-many relationship is justified."
    requiere: [c01]
    estado: ga
    competencias:
      - {id: c02-k1, es: "Crea relaciones 1:* con filtro simple y justifica cada excepción", en: "Creates one-to-many relationships with single filters and justifies every exception"}
      - {id: c02-k2, es: "Detecta caminos ambiguos y relaciones muchos a muchos", en: "Spots ambiguous paths and many-to-many relationships"}
    fuentes:
      - {titulo: "Bi-directional relationship guidance", url: "https://learn.microsoft.com/en-us/power-bi/guidance/relationships-bidirectional-filtering", nivel: A, consultado: "2026-11-14"}
      - {titulo: "Create and manage relationships in Power BI Desktop", url: "https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-create-and-manage-relationships", nivel: A, consultado: "2026-11-14"}

  - id: c03
    nivel: 1
    area: modelado
    titulo: {es: "Tabla calendario, sin Auto date/time", en: "Date table, without Auto date/time"}
    resumen:
      es: "Una tabla de fechas continua, marcada como tabla de fechas, y por qué apagar Auto date/time."
      en: "A continuous date table, marked as a date table, and why to turn off Auto date/time."
    requiere: [c02]
    estado: ga
    competencias:
      - {id: c03-k1, es: "Crea y marca una tabla calendario continua", en: "Creates and marks a continuous date table"}
      - {id: c03-k2, es: "Apaga Auto date/time y explica por qué", en: "Turns off Auto date/time and explains why"}
    fuentes:
      - {titulo: "Create date tables in Power BI Desktop", url: "https://learn.microsoft.com/en-us/power-bi/guidance/model-date-tables", nivel: A, consultado: "2026-11-14"}
      - {titulo: "Auto date/time guidance in Power BI Desktop", url: "https://learn.microsoft.com/en-us/power-bi/guidance/auto-date-time", nivel: A, consultado: "2026-11-14"}

  - id: c04
    nivel: 1
    area: dax
    titulo: {es: "Medidas vs columnas calculadas", en: "Measures vs calculated columns"}
    resumen:
      es: "Cuándo calcular por fila al cargar y cuándo calcular al momento, según lo que mire el visual."
      en: "When to compute row by row at refresh time and when to compute on the fly, depending on what the visual shows."
    requiere: [c01]
    estado: ga
    competencias:
      - {id: c04-k1, es: "Elige medida o columna según el grain y el uso", en: "Chooses a measure or a column based on grain and use"}
      - {id: c04-k2, es: "Usa medidas explícitas con formato y display folders", en: "Uses explicit measures with format strings and display folders"}
    fuentes:
      - {titulo: "Create measures for data analysis in Power BI Desktop", url: "https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-measures", nivel: A, consultado: "2026-11-14"}
      - {titulo: "Calculated columns and measures in DAX", url: "https://www.sqlbi.com/articles/calculated-columns-and-measures-in-dax/", nivel: A, consultado: "2026-11-14"}

  - id: c05
    nivel: 1
    area: dax
    titulo: {es: "CALCULATE básico", en: "CALCULATE basics"}
    resumen:
      es: "Cómo CALCULATE cambia el filter context con argumentos de filtro simples."
      en: "How CALCULATE changes the filter context with simple filter arguments."
    requiere: [c04]
    estado: ga
    competencias:
      - {id: c05-k1, es: "Modifica el filter context con filtros simples en CALCULATE", en: "Modifies the filter context with simple filters in CALCULATE"}
      - {id: c05-k2, es: "Predice el resultado cuando el filtro pisa una columna que ya filtra el visual", en: "Predicts the result when a filter overrides a column the visual already filters"}
    fuentes:
      - {titulo: "CALCULATE function (DAX)", url: "https://learn.microsoft.com/en-us/dax/calculate-function-dax", nivel: A, consultado: "2026-11-14"}
      - {titulo: "CALCULATE · DAX Guide", url: "https://dax.guide/calculate/", nivel: A, consultado: "2026-11-14"}

  - id: c06
    nivel: 1
    area: datos
    titulo: {es: "Preparar datos en la fuente: SQL primero; Power Query solo para leerlo", en: "Prepare data at the source: SQL first; Power Query only to read it"}
    resumen:
      es: "Transformar lo más arriba posible (la regla de Matthew Roche), con SQL o un script, y saber leer un query de Power Query y su query folding."
      en: "Transform as far upstream as possible (Matthew Roche's maxim) with SQL or a script, and know how to read a Power Query query and its folding."
    requiere: []
    estado: ga
    competencias:
      - {id: c06-k1, es: "Decide dónde transformar: en la fuente, antes que en el modelo", en: "Decides where to transform: at the source, before the model"}
      - {id: c06-k2, es: "Lee un query de Power Query y reconoce si hace query folding", en: "Reads a Power Query query and recognizes whether it folds"}
    fuentes:
      - {titulo: "Understanding query evaluation and query folding in Power Query", url: "https://learn.microsoft.com/en-us/power-query/query-folding-basics", nivel: A, consultado: "2026-11-14"}
      - {titulo: "Best practices when working with Power Query", url: "https://learn.microsoft.com/en-us/power-query/best-practices", nivel: A, consultado: "2026-11-14"}
      - {titulo: "Roche's Maxim of Data Transformation", url: "https://ssbipolar.com/2021/05/31/roches-maxim/", nivel: B, consultado: "2026-11-14"}

  - id: c07
    nivel: 1
    area: diseno
    titulo: {es: "Elegir el gráfico correcto", en: "Choosing the right chart"}
    resumen:
      es: "El gráfico sale de la pregunta: comparar, componer, distribuir, relacionar o seguir en el tiempo."
      en: "The chart follows the question: compare, compose, distribute, relate, or track over time."
    requiere: []
    estado: ga
    competencias:
      - {id: c07-k1, es: "Elige el gráfico según la pregunta de negocio", en: "Picks the chart based on the business question"}
      - {id: c07-k2, es: "Evita gráficos que distorsionan: 3D, barras con eje cortado y tortas con muchas partes", en: "Avoids distorting charts: 3D, truncated bar axes and many-slice pies"}
    fuentes:
      - {titulo: "Visualization types in Power BI", url: "https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a", nivel: A, consultado: "2026-11-14"}
      - {titulo: "Storytelling with Data", libro: swd, nivel: A, consultado: "2026-11-14"}

  - id: c08
    nivel: 1
    area: storytelling
    titulo: {es: "Títulos que concluyen y la gran idea", en: "Titles that conclude and the big idea"}
    resumen:
      es: "El título dice la conclusión, no el tema; y todo el informe cabe en una gran idea de una frase."
      en: "The title states the conclusion, not the topic, and the whole report fits in a one-sentence big idea."
    requiere: [c07]
    estado: no-aplica
    competencias:
      - {id: c08-k1, es: "Escribe títulos que dicen la conclusión", en: "Writes titles that state the conclusion"}
      - {id: c08-k2, es: "Resume el mensaje en una gran idea de una frase", en: "Sums up the message in a one-sentence big idea"}
    fuentes:
      - {titulo: "Storytelling with Data", libro: swd, nivel: A, consultado: "2026-11-14"}
      - {titulo: "Blog de Storytelling with Data", url: "https://www.storytellingwithdata.com/blog", nivel: B, consultado: "2026-11-14"}

  # ---------- Nivel 2 · Intermedio ----------
  - id: c09
    nivel: 2
    area: dax
    titulo: {es: "Contexto de fila y de filtro", en: "Row context and filter context"}
    resumen:
      es: "Los dos contextos de DAX: cuál existe en cada fórmula y por qué una columna calculada no filtra otras tablas."
