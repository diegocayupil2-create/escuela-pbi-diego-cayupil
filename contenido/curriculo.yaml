      - {titulo: "CALCULATE function (DAX)", url: "https://learn.microsoft.com/en-us/dax/calculate-function-dax", nivel: A, consultado: "2026-11-14"}

  - id: c11
    nivel: 2
    area: dax
    titulo: {es: "Iteradores y variables", en: "Iterators and variables"}
    resumen:
      es: "SUMX, AVERAGEX y RANKX cuando el cálculo es por fila, y VAR para leer mejor y evaluar una sola vez."
