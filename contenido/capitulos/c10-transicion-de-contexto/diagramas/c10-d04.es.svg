<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 318" role="img" aria-labelledby="c10-d04-t c10-d04-d">
<title id="c10-d04-t">Cada fila del iterador crea un filter context</title>
<desc id="c10-d04-d">Iterar dim_cliente, con 300 clientes, crea 300 filter context. Iterar una fact_ventas de 5 millones de líneas, de ejemplo, crea 5 millones. El margen lento hace 2 transiciones por línea; el rápido calcula con columnas y no hace ninguna.</desc>
<defs><marker id="c10-d04-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-flecha" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<text x="10" y="16" font-size="12" text-anchor="start" class="dg-texto2">Una transición por fila</text><text x="10" y="42" font-size="12.5" text-anchor="start" class="dg-texto dg-negrita">Iterar dim_cliente</text><text x="10" y="59" font-size="11.5" text-anchor="start" class="dg-texto2">300 filas → 300 contextos</text><rect x="10" y="68" width="8" height="16" rx="3" class="dg-si"/><path d="M26 76 l3.5 3.5 l7 -7.5" class="dg-trazo-si" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="81" font-size="12" text-anchor="start" class="dg-si dg-negrita">barato</text><text x="10" y="112" font-size="12.5" text-anchor="start" class="dg-texto dg-negrita">Iterar fact_ventas (ejemplo)</text><text x="10" y="129" font-size="11.5" text-anchor="start" class="dg-texto2">5.000.000 filas → 5.000.000 contextos</text><rect x="10" y="138" width="380" height="16" rx="3" class="dg-no"/><path d="M14 164 l8 8 M22 164 l-8 8" class="dg-trazo-no" fill="none" stroke-width="2.2" stroke-linecap="round"/><text x="30" y="172" font-size="12" text-anchor="start" class="dg-no dg-negrita">caro</text><path d="M10 190 H390" class="dg-borde" fill="none" stroke-width="1"/><rect x="10" y="204" width="185" height="104" rx="10" class="dg-no-fondo"/><path d="M22 220 l8 8 M30 220 l-8 8" class="dg-trazo-no" fill="none" stroke-width="2.2" stroke-linecap="round"/><text x="38" y="228" font-size="12.5" text-anchor="start" class="dg-no dg-negrita">Margen lento</text><text x="22" y="252" font-size="11" text-anchor="start" class="dg-texto dg-mono">SUMX ( fact_ventas,</text><text x="30" y="268" font-size="11" text-anchor="start" class="dg-texto dg-mono">[Ventas] - [Costo] )</text><text x="22" y="294" font-size="11.5" text-anchor="start" class="dg-texto2">2 transiciones por línea</text><rect x="205" y="204" width="185" height="104" rx="10" class="dg-si-fondo"/><path d="M216 224 l3.5 3.5 l7 -7.5" class="dg-trazo-si" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="234" y="228" font-size="12.5" text-anchor="start" class="dg-si dg-negrita">Margen rápido</text><text x="217" y="252" font-size="11" text-anchor="start" class="dg-texto dg-mono">SUMX ( fact_ventas,</text><text x="225" y="268" font-size="11" text-anchor="start" class="dg-texto dg-mono">monto - cantidad × costo )</text><text x="217" y="294" font-size="11.5" text-anchor="start" class="dg-texto2">0 transiciones: columnas</text>
</svg>
