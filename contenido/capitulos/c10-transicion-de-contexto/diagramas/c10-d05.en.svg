<title id="c10-d05-t">Sketch: how your visual should look</title>
<desc id="c10-d05-d">Sketch without numbers: a horizontal bar chart of large customers by region in 2024 and 2025. Bars are gray and only the region that drops the most is blue, with its difference labeled. The title states the conclusion and 3 executive points go below.</desc>
