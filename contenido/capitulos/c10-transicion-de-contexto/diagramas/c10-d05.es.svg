<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-labelledby="c10-d05-t c10-d05-d">
<title id="c10-d05-t">Boceto: así debería verse tu visual</title>
<desc id="c10-d05-d">Boceto sin números: un gráfico de barras horizontales con clientes grandes por región en 2024 y 2025. Las barras van en gris y solo la región que más cae va en azul, con su diferencia anotada. El título dice la conclusión y abajo van 3 puntos ejecutivos.</desc>
<defs><marker id="c10-d05-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-flecha" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect x="4" y="4" width="392" height="352" rx="12" class="dg-superficie dg-borde" stroke-width="1"/><text x="20" y="32" font-size="15" text-anchor="start" class="dg-texto dg-negrita">[Región] perdió [N] clientes</text><text x="20" y="51" font-size="15" text-anchor="start" class="dg-texto dg-negrita">grandes desde [mes]</text><text x="20" y="71" font-size="11.5" text-anchor="start" class="dg-texto2">Clientes grandes por región · 2024 y 2025</text><rect x="20" y="82" width="10" height="10" rx="2" class="dg-contexto" opacity="0.45"/><text x="34" y="91" font-size="11" text-anchor="start" class="dg-texto2">2024</text><rect x="78" y="82" width="10" height="10" rx="2" class="dg-contexto"/><text x="92" y="91" font-size="11" text-anchor="start" class="dg-texto2">2025</text><rect x="136" y="82" width="10" height="10" rx="2" class="dg-acento"/><text x="150" y="91" font-size="11" text-anchor="start" class="dg-texto2">la que más cae</text><text x="20" y="122" font-size="11.5" text-anchor="start" class="dg-texto2">Región A</text><rect x="92" y="110" width="150" height="10" rx="2" class="dg-contexto" opacity="0.45"/><rect x="92" y="122" width="190" height="10" rx="2" class="dg-contexto"/><text x="20" y="154" font-size="11.5" text-anchor="start" class="dg-texto2">Región B</text><rect x="92" y="142" width="100" height="10" rx="2" class="dg-contexto" opacity="0.45"/><rect x="92" y="154" width="100" height="10" rx="2" class="dg-contexto"/><text x="20" y="186" font-size="11.5" text-anchor="start" class="dg-texto2">Región C</text><rect x="92" y="174" width="140" height="10" rx="2" class="dg-contexto" opacity="0.45"/><rect x="92" y="186" width="82" height="10" rx="2" class="dg-acento"/><text x="240" y="195" font-size="12.5" text-anchor="start" class="dg-acento dg-negrita">−[N]</text><text x="20" y="218" font-size="11.5" text-anchor="start" class="dg-texto2">Región D</text><rect x="92" y="206" width="60" height="10" rx="2" class="dg-contexto" opacity="0.45"/><rect x="92" y="218" width="64" height="10" rx="2" class="dg-contexto"/><text x="20" y="250" font-size="11.5" text-anchor="start" class="dg-texto2">Región E</text><rect x="92" y="238" width="105" height="10" rx="2" class="dg-contexto" opacity="0.45"/><rect x="92" y="250" width="122" height="10" rx="2" class="dg-contexto"/><text x="20" y="282" font-size="11.5" text-anchor="start" class="dg-texto2">Región F</text><rect x="92" y="270" width="46" height="10" rx="2" class="dg-contexto" opacity="0.45"/><rect x="92" y="282" width="46" height="10" rx="2" class="dg-contexto"/><text x="20" y="316" font-size="11" text-anchor="start" class="dg-texto2">3 puntos ejecutivos</text><rect x="20" y="324" width="110" height="8" rx="4" class="dg-contexto" opacity="0.35"/><rect x="138" y="324" width="120" height="8" rx="4" class="dg-contexto" opacity="0.35"/><rect x="266" y="324" width="110" height="8" rx="4" class="dg-contexto" opacity="0.35"/>
