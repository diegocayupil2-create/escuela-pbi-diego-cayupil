<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" role="img" aria-labelledby="c10-d03-t c10-d03-d">
<title id="c10-d03-t">Two identical rows see each other</title>
<desc id="c10-d03-d">fact_ventas has no key and holds two identical lines of 100,000. On each row, context transition filters by every column and finds both: 200,000. SUMX adds 200,000 plus 200,000 and returns 400,000. If it was a single sale, the right answer was 100,000. The fix belongs at the source.</desc>
<defs><marker id="c10-d03-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-flecha" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<text x="10" y="16" font-size="12" text-anchor="start" class="dg-texto2">fact_ventas without a key: two identical lines</text><rect x="10" y="24" width="230" height="78" rx="8" class="dg-superficie dg-borde" stroke-width="1"/><rect x="11" y="25" width="228" height="25" rx="7" class="dg-superficie2"/><text x="20" y="39" font-size="11" text-anchor="start" class="dg-texto2 dg-mono dg-negrita">date</text><text x="90" y="39" font-size="11" text-anchor="start" class="dg-texto2 dg-mono dg-negrita">customer</text><text x="230" y="39" font-size="11" text-anchor="end" class="dg-texto2 dg-mono dg-negrita">amount</text><rect x="14" y="52" width="222" height="22" rx="4" class="dg-acento-suave"/><text x="20" y="65.5" font-size="12" text-anchor="start" class="dg-acento dg-negrita">14-03</text><text x="90" y="65.5" font-size="12" text-anchor="start" class="dg-acento dg-negrita">Ana</text><text x="230" y="65.5" font-size="12" text-anchor="end" class="dg-acento dg-negrita dg-mono">100,000</text><rect x="14" y="78" width="222" height="22" rx="4" class="dg-acento-suave"/><text x="20" y="91.5" font-size="12" text-anchor="start" class="dg-acento dg-negrita">14-03</text><text x="90" y="91.5" font-size="12" text-anchor="start" class="dg-acento dg-negrita">Ana</text><text x="230" y="91.5" font-size="12" text-anchor="end" class="dg-acento dg-negrita dg-mono">100,000</text><path d="M246 63 C262 63 262 89 246 89" class="dg-trazo-acento" fill="none" stroke-width="1.6" marker-start="url(#c10-d03-f)" marker-end="url(#c10-d03-f)"/><text x="266" y="67" font-size="11.5" text-anchor="start" class="dg-texto2">sees both →</text><text x="390" y="67" font-size="12" text-anchor="end" class="dg-texto dg-mono dg-negrita">200,000</text><text x="266" y="93" font-size="11.5" text-anchor="start" class="dg-texto2">sees both →</text><text x="390" y="93" font-size="12" text-anchor="end" class="dg-texto dg-mono dg-negrita">200,000</text><text x="10" y="132" font-size="12.5" text-anchor="start" class="dg-texto dg-mono">SUMX = 200,000 + 200,000</text><rect x="10" y="142" width="200" height="32" rx="10" class="dg-no-fondo"/><path d="M24 154 l8 8 M32 154 l-8 8" class="dg-trazo-no" fill="none" stroke-width="2.2" stroke-linecap="round"/><text x="42" y="163" font-size="14" text-anchor="start" class="dg-no dg-negrita">= $400,000</text><rect x="10" y="186" width="380" height="32" rx="10" class="dg-si-fondo"/><path d="M22 201 l3.5 3.5 l7 -7.5" class="dg-trazo-si" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="206" font-size="12.5" text-anchor="start" class="dg-si dg-negrita">Right answer, if it was one sale: $100,000</text><rect x="10" y="232" width="380" height="70" rx="10" class="dg-superficie2"/><text x="22" y="254" font-size="12.5" text-anchor="start" class="dg-texto dg-negrita">Fix at the source, with SQL or a script</text><text x="22" y="274" font-size="12" text-anchor="start" class="dg-texto">1 · a line id in the extract</text><text x="22" y="292" font-size="12" text-anchor="start" class="dg-texto">2 · remove the wrong duplicates there</text>
