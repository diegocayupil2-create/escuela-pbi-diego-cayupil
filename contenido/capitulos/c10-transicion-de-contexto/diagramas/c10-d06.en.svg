<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-labelledby="c10-d06-t c10-d06-d">
<title id="c10-d06-t">Sketch: how your visual should look</title>
<desc id="c10-d06-d">Sketch without numbers: three columns with March 2025 sales according to the ERP, to [Ventas] and to [Ventas por línea]. A dotted line marks what the ERP says; the column that drifts the most is blue. The title states the cause and the amount, and 3 executive points go below.</desc>
<defs><marker id="c10-d06-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-flecha" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect x="4" y="4" width="392" height="352" rx="12" class="dg-superficie dg-borde" stroke-width="1"/><text x="20" y="32" font-size="15" text-anchor="start" class="dg-texto dg-negrita">March didn't match because of [cause]:</text><text x="20" y="51" font-size="15" text-anchor="start" class="dg-texto dg-negrita">[amount] too much</text><text x="20" y="71" font-size="11.5" text-anchor="start" class="dg-texto2">March 2025 sales according to each calculation</text><path d="M30 140 H380" class="dg-trazo" fill="none" stroke-width="1.2" stroke-dasharray="4 4"/><text x="380" y="134" font-size="11" text-anchor="end" class="dg-texto2">what the ERP says</text><rect x="60" y="140" width="70" height="140" rx="4" class="dg-contexto" opacity="0.45"/><text x="95" y="298" font-size="11.5" text-anchor="middle" class="dg-texto2">ERP</text><rect x="165" y="130" width="70" height="150" rx="4" class="dg-contexto"/><text x="200" y="298" font-size="11.5" text-anchor="middle" class="dg-texto2 dg-mono">[Ventas]</text><text x="200" y="122" font-size="12.5" text-anchor="middle" class="dg-texto2 dg-negrita">+[X]</text><rect x="270" y="98" width="70" height="182" rx="4" class="dg-acento"/><text x="305" y="298" font-size="10.5" text-anchor="middle" class="dg-texto2 dg-mono">[Ventas por línea]</text><text x="305" y="90" font-size="12.5" text-anchor="middle" class="dg-acento dg-negrita">+[Y]</text><path d="M30 280 H380" class="dg-borde" fill="none" stroke-width="1"/><text x="20" y="318" font-size="11" text-anchor="start" class="dg-texto2">3 executive points</text><rect x="20" y="326" width="110" height="8" rx="4" class="dg-contexto" opacity="0.35"/><rect x="138" y="326" width="120" height="8" rx="4" class="dg-contexto" opacity="0.35"/><rect x="266" y="326" width="110" height="8" rx="4" class="dg-contexto" opacity="0.35"/>
</svg>
