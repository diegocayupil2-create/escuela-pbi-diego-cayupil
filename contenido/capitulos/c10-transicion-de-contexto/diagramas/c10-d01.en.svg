<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="c10-d01-t c10-d01-d">
<title id="c10-d01-t">The row becomes a filter and travels through the relationship</title>
<desc id="c10-d01-d">CALCULATE takes Ana's row in dim_cliente, turns it into the filter customer = Ana, the filter goes through the one-to-many relationship, and fact_ventas adds only Ana's lines: 300. Without CALCULATE, every row shows the company total, 900.</desc>
<defs><marker id="c10-d01-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-flecha" d="M0 0 L10 5 L0 10 z"/></marker></defs>
