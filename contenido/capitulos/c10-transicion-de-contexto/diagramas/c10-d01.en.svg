size="12" text-anchor="start" class="dg-texto2 dg-mono">fact_ventas</text><rect x="10" y="214" width="270" height="132" rx="8" class="dg-superficie dg-borde" stroke-width="1"/><rect x="11" y="215" width="268" height="21" rx="7" class="dg-superficie2"/><text x="22" y="229" font-size="11" text-anchor="start" class="dg-texto2 dg-mono dg-negrita">customer</text><text x="268" y="229" font-size="11" text-anchor="end" class="dg-texto2 dg-mono dg-negrita">amount</text><rect x="14" y="238" width="262" height="18" rx="4" class="dg-acento-suave"/><text x="22" y="251.5" font-size="12" text-anchor="start" class="dg-acento dg-negrita">Ana</text><text x="268" y="251.5" font-size="12" text-anchor="end" class="dg-acento dg-negrita dg-mono">100</text><text x="22" y="273.5" font-size="12" text-anchor="start" class="dg-texto2">Beto</text><text x="268" y="273.5" font-size="12" text-anchor="end" class="dg-texto2 dg-mono">200</text><rect x="14" y="282" width="262" height="18" rx="4" class="dg-acento-suave"/><text x="22" y="295.5" font-size="12" text-anchor="start" class="dg-acento dg-negrita">Ana</text><text x="268" y="295.5" font-size="12" text-anchor="end" class="dg-acento dg-negrita dg-mono">200</text><text x="22" y="317.5" font-size="12" text-anchor="start" class="dg-texto2">Carla</text><text x="268" y="317.5" font-size="12" text-anchor="end" class="dg-texto2 dg-mono">150</text><text x="22" y="339.5" font-size="12" text-anchor="start" class="dg-texto2">Beto</text><text x="268" y="339.5" font-size="12" text-anchor="end" class="dg-texto2 dg-mono">250</text><rect x="292" y="252" width="98" height="56" rx="10" class="dg-si-fondo"/><text x="341" y="273" font-size="12" text-anchor="middle" class="dg-si dg-mono">SUM</text><path d="M312 290 l3.5 3.5 l7 -7.5" class="dg-trazo-si" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="357" y="297" font-size="17" text-anchor="middle" class="dg-si dg-negrita">300</text><rect x="10" y="360" width="185" height="70" rx="10" class="dg-no-fondo"/><path d="M22 376 l8 8 M30 376 l-8 8" class="dg-trazo-no" fill="none" stroke-width="2.2" stroke-linecap="round"/><text x="38" y="384" font-size="12.5" text-anchor="start" class="dg-no dg-negrita">Without CALCULATE</text><text x="22" y="404" font-size="12" text-anchor="start" class="dg-texto">900 on every row</text><text x="22" y="420" font-size="11" text-anchor="start" class="dg-texto2">(the company total)</text><rect x="205" y="360" width="185" height="70" rx="10" class="dg-si-fondo"/><path d="M216 380 l3.5 3.5 l7 -7.5" class="dg-trazo-si" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="234" y="384" font-size="12.5" text-anchor="start" class="dg-si dg-negrita">With CALCULATE</text><text x="217" y="404" font-size="12" text-anchor="start" class="dg-texto">each customer's own</text><text x="217" y="420" font-size="12" text-anchor="start" class="dg-texto dg-mono">300 · 450 · 150</text>
