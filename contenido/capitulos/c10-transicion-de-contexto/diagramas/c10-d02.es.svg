<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 356" role="img" aria-labelledby="c10-d02-t c10-d02-d">
<title id="c10-d02-t">El CALCULATE escondido de una medida</title>
<desc id="c10-d02-d">Escribir [Ventas] dentro de FILTER equivale a CALCULATE de la suma. FILTER recorre dim_cliente: Ana 25 millones y Carla 31 millones pasan el umbral de 20 millones; Beto y Dora no. COUNTROWS da 2. Con SUM directo, cada fila ve el total de la empresa, 76 millones, y cuenta a los 4.</desc>
<defs><marker id="c10-d02-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-flecha" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<text x="10" y="16" font-size="12" text-anchor="start" class="dg-texto2">Lo que escribes</text><text x="184" y="16" font-size="12" text-anchor="start" class="dg-texto2">Lo que DAX evalúa</text><rect x="10" y="24" width="150" height="64" rx="10" class="dg-acento-suave"/><text x="85" y="61" font-size="15" text-anchor="middle" class="dg-acento dg-mono dg-negrita">[Ventas]</text><text x="172" y="63" font-size="20" text-anchor="middle" class="dg-texto2 dg-negrita">=</text><rect x="184" y="24" width="206" height="64" rx="10" class="dg-superficie2"/><text x="196" y="44" font-size="11.5" text-anchor="start" class="dg-acento dg-mono dg-negrita">CALCULATE (</text><text x="208" y="61" font-size="11.5" text-anchor="start" class="dg-texto dg-mono">SUM ( fact_ventas</text><text x="208" y="78" font-size="11.5" text-anchor="start" class="dg-texto dg-mono">[monto_neto] ) )</text><text x="10" y="114" font-size="11" text-anchor="start" class="dg-texto2 dg-mono">FILTER ( dim_cliente, [Ventas] &gt; 20.000.000 )</text><rect x="10" y="122" width="380" height="110" rx="8" class="dg-superficie dg-borde" stroke-width="1"/><rect x="11" y="123" width="378" height="21" rx="7" class="dg-superficie2"/><text x="22" y="137" font-size="11" text-anchor="start" class="dg-texto2 dg-mono dg-negrita">cliente</text><text x="240" y="137" font-size="11" text-anchor="end" class="dg-texto2 dg-mono dg-negrita">[Ventas]</text><text x="272" y="137" font-size="11" text-anchor="start" class="dg-texto2 dg-mono dg-negrita">¿&gt; 20 M?</text><text x="22" y="159.5" font-size="12" text-anchor="start" class="dg-texto">Ana</text><text x="240" y="159.5" font-size="12" text-anchor="end" class="dg-texto dg-mono">25.000.000</text><text x="272" y="159.5" font-size="12" text-anchor="start" class="dg-texto"></text><text x="22" y="181.5" font-size="12" text-anchor="start" class="dg-texto">Beto</text><text x="240" y="181.5" font-size="12" text-anchor="end" class="dg-texto dg-mono">12.000.000</text><text x="272" y="181.5" font-size="12" text-anchor="start" class="dg-texto"></text><text x="22" y="203.5" font-size="12" text-anchor="start" class="dg-texto">Carla</text><text x="240" y="203.5" font-size="12" text-anchor="end" class="dg-texto dg-mono">31.000.000</text><text x="272" y="203.5" font-size="12" text-anchor="start" class="dg-texto"></text><text x="22" y="225.5" font-size="12" text-anchor="start" class="dg-texto">Dora</text><text x="240" y="225.5" font-size="12" text-anchor="end" class="dg-texto dg-mono">8.000.000</text><text x="272" y="225.5" font-size="12" text-anchor="start" class="dg-texto"></text><path d="M264 154 l3.5 3.5 l7 -7.5" class="dg-trazo-si" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="282" y="159.5" font-size="12" text-anchor="start" class="dg-si dg-negrita">sí</text><path d="M265 173 l8 8 M273 173 l-8 8" class="dg-trazo-no" fill="none" stroke-width="2.2" stroke-linecap="round"/><text x="282" y="181.5" font-size="12" text-anchor="start" class="dg-no dg-negrita">no</text><path d="M264 198 l3.5 3.5 l7 -7.5" class="dg-trazo-si" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="282" y="203.5" font-size="12" text-anchor="start" class="dg-si dg-negrita">sí</text><path d="M265 217 l8 8 M273 217 l-8 8" class="dg-trazo-no" fill="none" stroke-width="2.2" stroke-linecap="round"/><text x="282" y="225.5" font-size="12" text-anchor="start" class="dg-no dg-negrita">no</text><rect x="10" y="244" width="270" height="30" rx="10" class="dg-si-fondo"/><path d="M22 259 l3.5 3.5 l7 -7.5" class="dg-trazo-si" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="264" font-size="12.5" text-anchor="start" class="dg-si dg-negrita">COUNTROWS = 2 clientes grandes</text><rect x="10" y="290" width="380" height="56" rx="10" class="dg-no-fondo"/><path d="M22 305 l8 8 M30 305 l-8 8" class="dg-trazo-no" fill="none" stroke-width="2.2" stroke-linecap="round"/><text x="38" y="313" font-size="12.5" text-anchor="start" class="dg-no dg-negrita">Con SUM directo dentro del FILTER</text><text x="22" y="334" font-size="12" text-anchor="start" class="dg-texto">cada fila ve 76.000.000: cuenta a los 4</text>
</svg>
