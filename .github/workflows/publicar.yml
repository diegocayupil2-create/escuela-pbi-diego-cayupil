# Publica el sitio en GitHub Pages. No usa IA ni claves: compila el HTML, lo revisa y lo sube.
# Corre solo cuando cambia algo en sitio/, contenido/ o datos/ en main, o cuando tú quieras:
# pestaña Actions → «Publicar» → «Run workflow».
# La primera vez hay que activar Pages: Settings → Pages → Source: «GitHub Actions».
# Si pausaste la escuela (variable ESCUELA_PAUSA = 1), no publica sola; a mano sí.
name: Publicar

on:
  push:
    branches: [main]
    paths:
      - "sitio/**"
      - "contenido/**"
      - "datos/**"
  workflow_dispatch: {}

# Lo mínimo: leer el repo y publicar en Pages (id-token lo pide GitHub para verificar que la publicación viene de aquí).
permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez. Si llega otra, espera su turno: nunca se corta una a medias.
concurrency:
  group: publicar-pages
  cancel-in-progress: false

jobs:
  compilar:
    if: vars.ESCUELA_PAUSA != '1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar lo necesario
        run: npm ci
      # Compila con Astro y revisa el resultado: páginas en los dos idiomas, links internos y lo que hace instalable la app.
      - name: Compilar y revisar el sitio
        run: node --test tests/sitio-compilado.test.mjs
      - name: Empaquetar para Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: sitio/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
